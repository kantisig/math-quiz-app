<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Student Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-100 p-6">
    <div class="max-w-3xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-slate-800">แบบทดสอบคณิตศาสตร์</h1>
        
        <!-- Quiz List -->
        <div id="quizContainer" class="space-y-4"></div>

        <!-- AI Chat -->
        <div class="bg-white p-4 rounded-xl shadow space-y-3">
            <h2 class="font-bold text-indigo-700">🤖 AI Assistant ช่วยตรวจ/อธิบายโจทย์</h2>
            <div id="chatLog" class="h-32 overflow-y-auto bg-slate-50 p-3 text-sm rounded border"></div>
            <div class="flex gap-2">
                <input type="text" id="aiPrompt" placeholder="ถามข้อสงสัยเกี่ยวกับโจทย์..." class="border p-2 rounded flex-1">
                <button onclick="askAI()" class="bg-indigo-600 text-white px-4 py-2 rounded">ส่งคำถาม</button>
            </div>
        </div>
    </div>

    <script>
        async function loadQuiz() {
            const res = await fetch('/api/student/questions');
            const questions = await res.json();
            document.getElementById('quizContainer').innerHTML = questions.map((q, idx) => `
                <div class="bg-white p-5 rounded-xl shadow space-y-3">
                    <p class="font-medium text-lg">ข้อ ${idx+1}: ${q.question}</p>
                    <div class="grid grid-cols-2 gap-2">
                        ${q.choices.map((c, i) => `
                            <button onclick="submitAnswer(${q.id}, ${i})" class="border p-2.5 rounded-lg hover:bg-indigo-50 text-left transition">${c}</button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            setTimeout(() => renderMathInElement(document.body), 100);
        }

        async function submitAnswer(qId, choiceIdx) {
            const res = await fetch('/api/student/submit-answer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question_id: qId, chosen_choice: choiceIdx })
            });
            const data = await res.json();
            alert(data.isCorrect ? '✨ ถูกต้อง!' : '❌ ตอบไม่ถูกต้อง');
        }

        async function askAI() {
            const prompt = document.getElementById('aiPrompt').value;
            if(!prompt) return;
            const log = document.getElementById('chatLog');
            log.innerHTML += `<div><b>คุณ:</b> ${prompt}</div>`;
            
            const res = await fetch('/api/student/ai-chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt })
            });
            const data = await res.json();
            log.innerHTML += `<div class="text-indigo-600"><b>AI:</b> ${data.response}</div>`;
            document.getElementById('aiPrompt').value = '';
        }

        loadQuiz();
    </script>
</body>
</html>
